<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 495 195" width="495" height="195">
  <style>
    .stat-number { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 28px; font-weight: 700; fill: #70a5fd; }
    .stat-label { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 14px; font-weight: 400; fill: #70a5fd; }
    .stat-date { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 11px; font-weight: 400; fill: #38bda8; }
    .streak-number { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 28px; font-weight: 700; fill: #bf91f7; }
    .streak-label { font-family: 'Segoe UI', Ubuntu, Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #bf91f7; }
  </style>

  <!-- Dark Card Background -->
  <rect width="495" height="195" rx="8" fill="#141427" stroke="#16162a" stroke-width="1"/>

  <!-- LEFT: Total Contributions -->
  <g transform="translate(82.5, 0)">
    <text x="0" y="82" text-anchor="middle" class="stat-number">1,009</text>
    <text x="0" y="115" text-anchor="middle" class="stat-label">Total Contributions</text>
    <text x="0" y="142" text-anchor="middle" class="stat-date">Jun 6, 2025 - Present</text>
  </g>

  <!-- Vertical Divider 1 -->
  <line x1="165" y1="40" x2="165" y2="155" stroke="#2c2c54" stroke-width="1.5"/>

  <!-- CENTER: Current Streak -->
  <g transform="translate(247.5, 0)">
    <!-- Ring -->
    <circle cx="0" cy="85" r="36" fill="none" stroke="#70a5fd" stroke-width="4" opacity="0.9"/>
    <!-- Flame Icon Badge -->
    <g transform="translate(-10, 36) scale(0.85)">
      <path d="M12 23c-4.97 0-9-4.03-9-9 0-3.53 2.04-6.58 5-8.05.55 1.95 2.1 3.45 4 4.05 1.9-1.9 2.5-4.65 1.5-7 3.55 1.7 6.5 5.3 6.5 9 0 4.97-4.03 9-9 9z" fill="#bf91f7"/>
    </g>
    <text x="0" y="94" text-anchor="middle" class="streak-number">32</text>
    <text x="0" y="148" text-anchor="middle" class="streak-label">Current Streak</text>
    <text x="0" y="168" text-anchor="middle" class="stat-date">Jun 25 - Jul 26</text>
  </g>

  <!-- Vertical Divider 2 -->
  <line x1="330" y1="40" x2="330" y2="155" stroke="#2c2c54" stroke-width="1.5"/>

  <!-- RIGHT: Longest Streak -->
  <g transform="translate(412.5, 0)">
    <text x="0" y="82" text-anchor="middle" class="stat-number">43</text>
    <text x="0" y="115" text-anchor="middle" class="stat-label">Longest Streak</text>
    <text x="0" y="142" text-anchor="middle" class="stat-date">May 13 - Jun 24</text>
  </g>
</svg>
